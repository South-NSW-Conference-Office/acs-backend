# -----------------------------------------------------------------------------
# acs-backend — CI/CD (Staging)
#
# Migrated 2026-08-17 from kylevps to morpheus (arm64). Deploys the staging
# backend container on morpheus (port 5050) — the public API proxy stub on
# snswserver (which fronts both prod and staging) is synced by the production
# workflow's deploy-api-proxy job, not this one. See deploy/README.md.
#
# kylevps is KEPT as a parallel fallback target (user request) while DNS
# cutover is pending — build-and-push therefore produces a multi-arch
# (amd64+arm64) manifest under one tag so both hosts pull their native image.
# Remove deploy-backend-staging-legacy once kylevps is decommissioned.
# -----------------------------------------------------------------------------

name: Build and Deploy Docker (Staging)

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: south-nsw-conference-office/acs-backend

jobs:
  build-and-push:
    name: Build & push (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for amd64 cross-build on this arm64 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging
            type=sha,prefix=staging-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-backend-staging:
    name: Deploy staging backend on morpheus (pull-only)
    needs: build-and-push
    runs-on: [self-hosted, morpheus]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync compose file into deploy dir
        run: |
          mkdir -p /home/morpheus/adventist-community-services-staging
          cp deploy/docker-compose-staging.morpheus.yml /home/morpheus/adventist-community-services-staging/docker-compose.yml

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull & restart staging backend
        working-directory: /home/morpheus/adventist-community-services-staging
        run: |
          docker compose pull
          docker compose up -d --remove-orphans

      - name: Prune dangling images
        run: docker image prune -f

  # Original deploy target, kept running in parallel as a fallback until DNS
  # cuts over to the new infra — remove this job once kylevps is
  # decommissioned. Unchanged from the pre-migration workflow.
  # kylevps's stored `docker login ghcr.io` credential is expired (predates
  # this migration), so a fresh login with this run's GITHUB_TOKEN happens
  # first — see docker-deploy.yml's deploy-backend-legacy for the same fix.
  deploy-backend-staging-legacy:
    name: Deploy staging backend on kylevps (legacy, parallel fallback)
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: acs-backend
    steps:
      - name: Deploy to Genesis VPS (Staging, legacy)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VPS_STAGING_HOST || vars.VPS_HOST }}
          username: ${{ vars.VPS_STAGING_USERNAME || vars.VPS_USERNAME }}
          key: ${{ vars.VPS_STAGING_SSH_KEY || vars.VPS_SSH_KEY }}
          port: ${{ vars.VPS_STAGING_PORT || vars.VPS_PORT }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            cd /opt/adventist-community-services-staging
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
