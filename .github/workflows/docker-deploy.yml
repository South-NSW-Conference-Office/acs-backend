# -----------------------------------------------------------------------------
# acs-backend — CI/CD (Production)
#
# Migrated 2026-08-17 from kylevps (Genesis, amd64) to morpheus (NVIDIA GB10,
# arm64) + a public front-door proxy stub on snswserver. See deploy/README.md.
# kylevps is KEPT as a parallel fallback target (user request) while DNS
# cutover is pending — build-and-push therefore produces a multi-arch
# (amd64+arm64) manifest under one tag so both hosts pull their native image.
#
#   build-and-push     : multi-arch (amd64+arm64) build on ubuntu-24.04-arm
#                         (amd64 side via QEMU), push to GHCR.
#   deploy-backend      : pull-only, runs ON morpheus via its self-hosted
#                         runner (arm64 image).
#   deploy-api-proxy    : syncs the snswserver reverse-proxy stub that exposes
#                         api.communityservices.org.au publicly (over
#                         Tailscale to morpheus) — GitHub-hosted runner over
#                         SSH, mirroring adventistpulse/morpheustools frontend.
#   deploy-backend-legacy: pull-only on kylevps (amd64 image), the ORIGINAL
#                         deploy target — kept running in parallel until DNS
#                         cuts over and this job is removed.
# -----------------------------------------------------------------------------

name: Build and Deploy Docker (Production)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: south-nsw-conference-office/acs-backend

jobs:
  build-and-push:
    name: Build & push (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for amd64 cross-build on this arm64 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-backend:
    name: Deploy backend on morpheus (pull-only)
    needs: build-and-push
    runs-on: [self-hosted, morpheus]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync compose file into deploy dir
        run: |
          mkdir -p /home/morpheus/adventist-community-services
          cp deploy/docker-compose.morpheus.yml /home/morpheus/adventist-community-services/docker-compose.yml

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull & restart backend
        working-directory: /home/morpheus/adventist-community-services
        run: |
          docker compose pull
          docker compose up -d --remove-orphans

      - name: Prune dangling images
        run: docker image prune -f

  deploy-api-proxy:
    name: Sync public API proxy on snswserver
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-acs-api-proxy-snswserver
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy proxy compose + nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 107.155.65.229
          username: snswcomms
          key: ${{ secrets.SNSW_SSH_KEY }}
          source: "deploy/docker-compose.snswserver.yml,deploy/nginx-api-proxy.conf"
          target: /opt/acs-api-proxy/

      - name: Pull and restart on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 107.155.65.229
          username: snswcomms
          key: ${{ secrets.SNSW_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            cd /opt/acs-api-proxy
            mv deploy/docker-compose.snswserver.yml docker-compose.yml
            mv deploy/nginx-api-proxy.conf nginx-api-proxy.conf
            rmdir deploy 2>/dev/null || true
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}

  # Original deploy target, kept running in parallel as a fallback until DNS
  # cuts over to the new infra — remove this job once kylevps is
  # decommissioned. Unchanged from the pre-migration workflow.
  deploy-backend-legacy:
    name: Deploy backend on kylevps (legacy, parallel fallback)
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: acs-backend
    steps:
      - name: Deploy to Genesis VPS (legacy)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          key: ${{ vars.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT }}
          script: |
            cd /opt/adventist-community-services
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
