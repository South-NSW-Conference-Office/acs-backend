# =============================================================================
# acs-backend — STAGING docker-compose for the **morpheus** host
# (NVIDIA GB10, linux/arm64). Migrated from kylevps (76.13.176.13) 2026-08-17.
# =============================================================================
#
# Lives at /home/morpheus/adventist-community-services-staging/docker-compose.yml on
# morpheus. The "deploy-backend-staging" CI job copies it here, then runs
# `docker compose pull && up -d`. See docker-compose.morpheus.yml (prod) for
# full architecture notes — this file mirrors it, differing only in image tag,
# container name, port (5050, to avoid colliding with prod's 5000 on the same
# host), and database name.
# =============================================================================

services:
  backend:
    image: ghcr.io/south-nsw-conference-office/acs-backend:${IMAGE_TAG:-staging}
    container_name: acs-backend-staging
    restart: unless-stopped

    env_file:
      - .env.backend

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "127.0.0.1:5050:5000"
      - "100.87.6.30:5050:5000"

    volumes:
      - ./logs:/app/logs

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
