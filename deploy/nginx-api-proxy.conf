# nginx config for acs-api-proxy (runs INSIDE the container at
# /etc/nginx/conf.d/default.conf). This container's only job is to sit on
# snswserver's shared proxy-network and forward api.communityservices.org.au /
# staging-api.communityservices.org.au to acs-backend / acs-backend-staging on
# morpheus over Tailscale (100.87.6.30:5000 / :5050) — see docker-compose.
# snswserver.yml for why this exists (ACS's API has no same-stack frontend to
# proxy through, unlike morpheustools/cfodashboard).

# Upload body size. nginx defaults client_max_body_size to 1m, which silently
# capped every image upload: the API itself allows 5MB per file (multer, see
# middleware/uploadMiddleware.js) and up to 10 files per gallery request, but
# anything over 1MB total was rejected here with a 413 before it ever reached
# the app. Worse for diagnosis, nginx's 413 carries no CORS headers, so the
# browser reported a bare "Failed to fetch" rather than the status — which is
# how a 2.5MB photo looked like a broken uploader.
#
# 60m covers the app's own worst case (10 x 5MB plus multipart overhead) and
# leaves multer as the real limit, which is where the limit belongs: it can
# answer with a JSON error the panel can display.
client_max_body_size 60m;

server {
    listen 80;
    server_name api.communityservices.org.au;

    location / {
        proxy_pass http://100.87.6.30:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name staging-api.communityservices.org.au;

    location / {
        proxy_pass http://100.87.6.30:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
