# nginx config for acs-api-proxy (runs INSIDE the container at
# /etc/nginx/conf.d/default.conf). This container's only job is to sit on
# snswserver's shared proxy-network and forward api.communityservices.org.au /
# staging-api.communityservices.org.au to acs-backend / acs-backend-staging on
# morpheus over Tailscale (100.87.6.30:5000 / :5050) — see docker-compose.
# snswserver.yml for why this exists (ACS's API has no same-stack frontend to
# proxy through, unlike morpheustools/cfodashboard).

server {
    listen 80;
    server_name api.communityservices.org.au;

    location / {
        proxy_pass http://100.87.6.30:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name staging-api.communityservices.org.au;

    location / {
        proxy_pass http://100.87.6.30:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
